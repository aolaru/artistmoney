name: Research Queue Audit

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the publication gate
        run: node scripts/audit-research-candidates.mjs

      - name: Report research queue
        run: node scripts/report-research-queue.mjs

      - name: Publish research report
        if: always()
        run: |
          if [ -f .autopilot/research-queue-summary.md ]; then
            cat .autopilot/research-queue-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Research queue audit failed before a report was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-queue-report
          path: |
            .autopilot/research-queue-summary.md
            .autopilot/research-queue-result.json
          if-no-files-found: error
